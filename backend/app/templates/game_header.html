<header
    class="flex items-center justify-between whitespace-nowrap border-b border-solid border-neutral-light dark:border-neutral-dark bg-surface-light dark:bg-surface-dark px-6 py-3 flex-shrink-0 z-10 shadow-sm">
    <div class="flex items-center gap-4">
        <div class="size-6 text-primary">
            <span class="material-symbols-outlined text-2xl">science</span>
        </div>
        <div>
            <h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">Codenames
                Duet: Game Platform</h2>
            <div class="flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                <span class="font-medium bg-primary/10 text-primary px-1.5 py-0.5 rounded">EXP-{{ state.game_id[:8]
                    }}</span>
                <span>•</span>
                <span>Provider: {{ model_provider }}</span>
                <span>•</span>
                <span>Model: {{ model_name }}</span>
                <span>•</span>
                <span>Board: {{ state.board.category }}</span>
            </div>
        </div>
    </div>
    <div class="flex flex-1 justify-end gap-6 items-center">
        <!-- Progress Indicators -->
        {% include "partials/_game_stats.html" %}
        <!-- Action Buttons -->
        <div class="flex gap-2">
            <button
                class="flex items-center justify-center rounded-lg h-9 px-4 bg-primary text-white text-sm font-medium hover:bg-primary/90 transition-colors shadow-sm">
                <span class="mr-2 material-symbols-outlined text-lg">download</span>
                Export Log
            </button>
            <button
                class="flex items-center justify-center rounded-lg h-9 w-9 bg-neutral-light dark:bg-neutral-dark text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
                onclick="window.location='/';">
                <span class="material-symbols-outlined text-lg">exit_to_app</span>
            </button>
        </div>
    </div>
</header>
