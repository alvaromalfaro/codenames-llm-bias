<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Codenames Duet: LLM Bias Analysis</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <script>
        // Dark mode based on user preference or system setting
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        // Light mode colors
                        primary: "#10b981",
                        "primary-content": "#ffffff",
                        "primary-light": "#ecfdf5",
                        "background-light": "#f9fafb",
                        "surface-light": "#ffffff",
                        "text-main": "#0d141b",
                        "border-light": "#e7edf3",

                        // Dark mode colors
                        "primary-dark": "#34d399",
                        "background-dark": "#020617",
                        "surface-dark": "#0f172a",
                        "text-dark-main": "#f1f5f9",
                        "text-dark-muted": "#8ea39a",
                        "border-dark": "#232927",
                    },
                    fontFamily: {
                        "display": ["Geist", "sans-serif"],
                        "body": ["Geist", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-text-main dark:text-slate-100 font-display min-h-screen flex flex-col">
    <!-- Navigation header -->
    <header
        class="w-full border-b border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark sticky top-0 z-50">
        <div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <!-- Logo and site title -->
                <div class="flex items-center gap-3">
                    <div
                        class="flex items-center justify-center size-8 rounded bg-primary/10 text-primary dark:text-primary-light">
                        <span class="material-symbols-outlined" style="font-size: 24px;">network_intelligence</span>
                    </div>
                    <a href="/"
                        class="text-lg font-bold tracking-tight text-text-main dark:text-white hidden sm:block">LLM
                        Bias Analysis</a>
                    <div class="h-6 w-px bg-border-light dark:bg-border-dark mx-2 hidden sm:block"></div>
                </div>

                <!-- Navigation links and dark mode toggle -->
                <nav class="flex items-center gap-4 sm:gap-6">
                    <a class="text-sm font-medium text-text-main hover:text-primary dark:text-slate-200 dark:hover:text-primary-light transition-colors"
                        href="#">About</a>

                    <a class="text-sm font-medium text-text-main hover:text-primary dark:text-slate-200 dark:hover:text-primary-light transition-colors"
                        href="https://github.com/alvaromalfaro/codenames-llm-bias" target="_blank">Collaborate</a>

                    <a class="text-sm font-medium text-text-main hover:text-primary dark:text-slate-200 dark:hover:text-primary-light transition-colors"
                        href="#">Contact</a>

                    <button onclick="toggleTheme()"
                        class="flex items-center justify-center size-9 rounded-lg text-text-muted hover:text-primary dark:text-slate-400 dark:hover:text-primary-light hover:bg-border-light dark:hover:bg-border-dark transition-colors"
                        aria-label="Toggle dark mode">
                        <span class="material-symbols-outlined dark:hidden" style="font-size:20px">dark_mode</span>
                        <span class="material-symbols-outlined hidden dark:inline"
                            style="font-size:20px">light_mode</span>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main content area -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer
        class="bg-background-light dark:bg-background-dark border-t border-border-light dark:border-border-dark pt-12 pb-8">
        <div class="max-w-[1280px] mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-center justify-center text-center">
                <p class="text-sm text-text-muted dark:text-slate-500 max-w-md mb-6">
                    Developed by Álvaro Martínez as part of his final degree project. <br />
                    University of Castilla-La Mancha, 2026.
                </p>
                <div class="flex flex-wrap justify-center gap-x-8 gap-y-4 mb-8">
                    <a class="text-sm text-text-muted hover:text-primary dark:text-slate-400 dark:hover:text-primary-light transition-colors"
                        href="#">Contact</a>
                </div>
                <div class="flex flex-wrap justify-center gap-x-6 gap-y-4 mb-8">
                    <a class="flex items-center gap-2 text-sm text-text-muted hover:text-primary dark:text-slate-400 dark:hover:text-primary-light transition-colors"
                        href="https://github.com/alvaromalfaro" target="_blank" rel="noopener noreferrer">
                        <svg class="size-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.605-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z" />
                        </svg>
                        GitHub
                    </a>
                </div>
            </div>
        </div>
    </footer>
    <script>
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark')
            localStorage.theme = isDark ? 'dark' : 'light'
        }
    </script>
</body>

</html>
