# pyproject.toml - board_generator
#
# Self-contained tool that generates the fixed bank of Codenames Duet boards. Isolated from the
# platform: no platform deps here, no shared "common" code.
#
# Workflow: uv (https://docs.astral.sh/uv/). `uv sync --frozen` installs runtime + dev at the
# versions of uv.lock, on the Python of .python-version.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "board-generator"
version = "0.1.0"
description = "Fixed-bank Codenames Duet board generator for measuring gender bias in LLMs"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Álvaro Martínez Alfaro" }]
license = "MIT"

dependencies = [
    # --- Numerics / data handling ---
    "numpy>=2.0",
    "pandas>=2.2",            # word lists + per-word covariate tables
    "openpyxl>=3.1",          # SUBTLEX-US is distributed as .xlsx (lexical frequency)

    # --- Covariate balancing ---
    "scikit-learn>=1.5",      # propensity score matching (logistic propensity + NN matching)
    "scipy>=1.13",            # Mann-Whitney U; Cohen's d helpers
    "statsmodels>=0.14",      # TOST equivalence test (ttost_ind)

    # --- External arbiter encoder for cosine / Eq. 4.1 ---
    # Pulls torch + transformers. MUST stay independent from the evaluated models. The same version
    # as the platform's `embeddings` extra, with the rest of the stack pinned below, so that the
    # phi* vectors of both projects are comparable.
    "sentence-transformers==5.5.1",
    "huggingface-hub>=1.0",   # emit_frame reads the pinned snapshot from the local HF cache

    # --- Polysemy covariate = number of WordNet synsets ---
    "nltk>=3.9",
]

[project.scripts]
# Makes `uv run board-generator` valid. cli.py must expose a main() entry point.
board-generator = "board_generator.cli:main"

[dependency-groups]
# Installed by `uv sync` by default. (pip users: install these manually or via `--group dev`.)
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",           # typing for pandas under mypy
]

[tool.uv]
# The embedding stack at the versions of the platform's uv.lock (its `embeddings` extra), so that
# a vector encoded here and one encoded by scripts/backfill_embeddings.py come from the same code.
# Change them together with the platform's lock.
constraint-dependencies = [
    "transformers==5.19.0",
    "tokenizers==0.23.2",
    "torch==2.14.1",
    "huggingface-hub==1.33.0",
    "safetensors==0.8.0",
]

# On Linux (CI, devcontainer) torch comes from PyTorch's CPU index: PyPI's Linux wheel pulls the
# CUDA libraries, several GB the generator never uses. Windows and macOS wheels on PyPI are CPU
# builds already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# Packaging: the import package is ./board_generator/
# i.e. board_generator/board_generator/*.py - outer dir is the project, inner is the package.
[tool.hatch.build.targets.wheel]
packages = ["board_generator"]

# Lint + format (ruff replaces black + flake8 + isort)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "N",        # pep8-naming
    "SIM",      # flake8-simplify
]

# Static typing
[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true     # our own code must be typed
files = ["board_generator", "tests"]

[[tool.mypy.overrides]]
# These ship without type stubs; don't fail on their missing annotations.
module = ["sentence_transformers.*", "nltk.*", "statsmodels.*", "sklearn.*", "scipy.*"]
ignore_missing_imports = true

# Tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration' --strict-markers"
markers = ["integration: requires a real HF model; offline by default"]
