services:
  # Relational database for games, words, and embeddings
  db:
    image: ankane/pgvector:latest
    container_name: codenames-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker_volumes/postgres_data:/var/lib/postgresql/data

  # Local LLM inference via Ollama. Runs on CPU by default; add docker-compose.gpu.yml
  # to reserve an NVIDIA GPU (see README).
  ollama:
    image: ollama/ollama:latest
    container_name: codenames-ollama
    # Strip any CR before running, so a CRLF checkout on Windows still works
    entrypoint:
      - /bin/bash
      - -c
      - sed 's/\r$$//' /ollama_entrypoint.sh > /tmp/ollama_entrypoint.sh && exec /bin/bash /tmp/ollama_entrypoint.sh
    ports:
      - "11434:11434"
    volumes:
      - ./docker_volumes/ollama_data:/root/.ollama
      - ./ollama_entrypoint.sh:/ollama_entrypoint.sh:ro
      - ./backend/app/config.py:/llm_models.py:ro

  # Backend with FastAPI
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codenames-backend
    working_dir: /workspace
    # Watch only the app code: the repo root also holds docker_volumes/postgres_data, which this
    # user cannot read and which would crash the reloader
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir backend
    volumes:
      - ./:/workspace # Backend source code
      - ./data:/workspace/data # External files for words and biases
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /workspace
    env_file:
      - .env # Include environment variables from .env file
    depends_on:
      - db
      - ollama
