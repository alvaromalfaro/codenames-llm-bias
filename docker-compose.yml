services:
  # Relational database for games, words, and embeddings
  db:
    image: ankane/pgvector:latest
    container_name: codenames-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # NoSQL database for raw JSON from LLMs
  mongodb:
    image: mongo:latest
    container_name: codenames-mongo
    restart: always # Always restart if it fails
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Backend with FastAPI
  app:
    build: ./backend
    container_name: codenames-backend 
    volumes:
      - ./backend:/app # Backend source code
      - ./data:/app/data # External files for words and biases
    ports:
      - "8000:8000"
    env_file:
      - .env # Include environment variables from .env file
    depends_on:
      - db
      - mongodb

volumes:
  postgres_data:
  mongo_data: