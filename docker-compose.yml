services:
  # Relational database for games, words, and embeddings
  db:
    # Pinned, like every image here: a pull must not change the stack under a batch. Postgres 15 and
    # Debian bookworm, as the ankane/pgvector image this replaced, so its data directory still works.
    image: pgvector/pgvector:0.8.7-pg15-bookworm
    container_name: codenames-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Loopback only: the host's scripts reach it, the rest of the network does not.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker_volumes/postgres_data:/var/lib/postgresql/data

  # Local LLM inference via Ollama. Runs on CPU by default; add docker-compose.gpu.yml
  # to reserve an NVIDIA GPU (see README).
  ollama:
    # The version config.EXPECTED_LOCAL_DIGESTS was validated with: another Ollama may serve another
    # digest (it converts mistral-small3.2 on first load), and the digest gate then stops the batch.
    image: ollama/ollama:0.40.2
    container_name: codenames-ollama
    # Strip any CR before running, so a CRLF checkout on Windows still works
    entrypoint:
      - /bin/bash
      - -c
      - sed 's/\r$$//' /ollama_entrypoint.sh > /tmp/ollama_entrypoint.sh && exec /bin/bash /tmp/ollama_entrypoint.sh
    # Loopback only: Ollama has no authentication, so the rest of the network must not reach it.
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./docker_volumes/ollama_data:/root/.ollama
      - ./ollama_entrypoint.sh:/ollama_entrypoint.sh:ro
      - ./backend/app/config.py:/llm_models.py:ro

  # The Python environment for the migrations, the batch and the scripts. It serves nothing: it
  # stays up so they can run in it with `docker compose exec app ...`.
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codenames-backend
    working_dir: /workspace
    command: sleep infinity
    # An init process as PID 1 forwards the stop signal, which sleep alone ignores.
    init: true
    volumes:
      - ./:/workspace # Backend source code
      - ./data:/workspace/data # External files for words and biases
    environment:
      PYTHONPATH: /workspace
    env_file:
      - .env # Include environment variables from .env file
    depends_on:
      - db
      - ollama
