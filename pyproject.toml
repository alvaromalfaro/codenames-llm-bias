[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codenames-llm-bias"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "jinja2",
    "psycopg2-binary",
    "SQLAlchemy>=2.0",
    "alembic",
    "pgvector",
    "openai",
    "numpy",
    "ollama",
    "python-multipart",
    "nltk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# Offline phi* embedding backfill only (scripts/backfill_embeddings.py). Deliberately not a default
# dependency: it pulls torch, which has no business in the FastAPI image. Pinned to the exact version
# in board_generator/uv.lock so platform-side vectors stay comparable to the generator's.
embeddings = [
    "sentence-transformers==5.5.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
